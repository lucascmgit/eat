services:
  - type: web
    name: eat
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DATA_DIR
        value: /data
    disk:
      name: eat-data
      mountPath: /data
      sizeGB: 1
